# 生产用：评估服务 + 演示站
#   docker compose -f docker-compose.prod.yml up -d --build
# 只用 80 起步；上了域名再放开 443（见 README）。

services:
  mcp:
    build:
      context: ../mcp_server
      dockerfile: Dockerfile
    image: liaoyuyoufang/mcp-kimore:0.1.0
    container_name: mcp-kimore
    restart: unless-stopped
    expose:
      - "9100"
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.socket(); s.settimeout(3); sys.exit(0 if s.connect_ex(('127.0.0.1',9100))==0 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  web:
    image: nginx:1.27-alpine
    container_name: liaoyuyoufang-web
    restart: unless-stopped
    depends_on:
      mcp:
        condition: service_healthy
    ports:
      - "80:80"
      # 配好证书再放开：
      # - "443:443"
    volumes:
      - ../demo:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./certs:/etc/nginx/certs:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
