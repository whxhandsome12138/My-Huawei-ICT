<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>腰衡 · 动作评估（回放演示）</title>
<style>
  :root{
    --ink:#1c1c1e; --muted:#6b6b70; --line:#e3e3e6; --bg:#fbfbfa;
    --card:#ffffff; --accent:#1f5f5b; --warn-bg:#fdf6e7; --warn-line:#e8d9b0;
    --ok:#1f7a4d; --bad:#a33a2c;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1060px;margin:0 auto;padding:0 24px 80px}
  header{padding:44px 0 22px;border-bottom:1px solid var(--line)}
  h1{margin:0 0 6px;font-size:26px;font-weight:600;letter-spacing:.5px}
  .sub{color:var(--muted);font-size:14px}
  .banner{
    margin:22px 0 0;padding:14px 18px;background:var(--warn-bg);
    border:1px solid var(--warn-line);border-radius:4px;font-size:13.5px;color:#5a4a22;
  }
  .banner b{color:#7a5c14}
  section{margin-top:40px}
  h2{font-size:15px;font-weight:600;letter-spacing:1px;color:var(--muted);
     margin:0 0 16px;text-transform:uppercase}
  h2 span{color:var(--ink);letter-spacing:0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:6px;
    padding:16px 18px;cursor:pointer;transition:.15s;position:relative;
  }
  .card:hover{border-color:#c9c9cf;transform:translateY(-1px)}
  .card.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .card .tagline{font-size:11px;letter-spacing:1px;color:var(--accent);
     text-transform:uppercase;margin-bottom:6px}
  .card h3{margin:0 0 6px;font-size:15px;font-weight:600}
  .card p{margin:0;font-size:13px;color:var(--muted);line-height:1.6}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:22px 24px}
  .empty{color:var(--muted);font-size:14px;padding:28px 0;text-align:center}
  .chain{list-style:none;margin:0;padding:0;counter-reset:s}
  .chain li{
    position:relative;padding:12px 0 12px 40px;border-bottom:1px dashed var(--line);
  }
  .chain li:last-child{border-bottom:0}
  .chain li::before{
    counter-increment:s; content:counter(s);
    position:absolute;left:0;top:14px;width:22px;height:22px;border-radius:50%;
    background:#eef3f2;color:var(--accent);font-size:12px;font-weight:600;
    display:flex;align-items:center;justify-content:center;
  }
  .tool{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;font-weight:600}
  .args{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;
        color:var(--muted);margin-left:8px}
  .st{font-size:11px;padding:1px 7px;border-radius:10px;margin-left:8px;
      border:1px solid var(--line);color:var(--muted)}
  .st.ok{color:var(--ok);border-color:#cfe6da;background:#f2faf5}
  .st.bad{color:var(--bad);border-color:#eed3cd;background:#fdf4f2}
  details{margin-top:8px}
  summary{cursor:pointer;font-size:12.5px;color:var(--muted);outline:none}
  summary:hover{color:var(--ink)}
  pre{
    margin:10px 0 0;padding:14px;background:#f7f7f5;border:1px solid var(--line);
    border-radius:4px;font:12px/1.6 ui-monospace,Menlo,Consolas,monospace;
    overflow:auto;max-height:340px;white-space:pre;
  }
  .out h3{font-size:14px;margin:26px 0 10px;padding-left:10px;
          border-left:3px solid var(--accent);font-weight:600}
  .out h3:first-child{margin-top:0}
  .out p{margin:6px 0}
  .out .lead{font-size:15.5px}
  table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13.5px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
  th{font-weight:600;font-size:12.5px;color:var(--muted);background:#fafaf8}
  td.num{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
  .note{font-size:12.5px;color:var(--muted);margin-top:10px}
  .kv{display:flex;gap:18px;flex-wrap:wrap;margin:8px 0}
  .kv div{font-size:13px}
  .kv b{display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-bottom:2px}
  .qa{border:1px solid var(--line);border-radius:6px;background:var(--card);overflow:hidden}
  .qa details{border-bottom:1px solid var(--line);margin:0}
  .qa details:last-child{border-bottom:0}
  .qa summary{padding:15px 20px;font-size:14px;color:var(--ink);list-style:none}
  .qa summary::-webkit-details-marker{display:none}
  .qa summary::before{content:"问";font-size:11px;color:var(--accent);
      margin-right:10px;border:1px solid #cfe0de;border-radius:3px;padding:0 4px}
  .qa .ans{padding:0 20px 18px 42px;font-size:14px}
  .qa .ans p{margin:0 0 8px}
  .qa .ans p:last-child{margin-bottom:0}
  footer{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);
         font-size:12.5px;color:var(--muted);line-height:1.9}
  code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;
       background:#f2f2ef;padding:1px 5px;border-radius:3px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>腰衡 · 动作评估</h1>
    <div class="sub">面向腰痛居家康复的动作评估与随访 · 离线回放演示</div>
  </header>

  <div class="banner">
    <b>这是回放演示，不是实时评估。</b>

    不做诊断、不给训练处方、不评价疗效。真实的智能体在 Nexent 平台上运行，本页只是把同一批工具返回摊开给你看。
  </div>

  <section>
    <h2><span>① 选一个场景</span></h2>
    <div class="grid" id="scenarios"></div>
  </section>

  <section>
    <h2><span>② 工具调用链</span></h2>
    <div class="panel" id="chain"><div class="empty">先在上面选一个场景</div></div>
  </section>

  <section>
    <h2><span>③ 输出</span></h2>
    <div class="panel" id="output"><div class="empty">先在上面选一个场景</div></div>
  </section>

  <section>
    <h2><span>④ 可以这样问它</span></h2>
    <div class="qa" id="qa"></div>
  </section>

  <footer id="foot"></footer>
</div>

const $ = (id) => document.getElementById(id);
const fmt = (n, d = 3) => (typeof n === "number" ? n.toFixed(d) : String(n));

function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function renderScenarios() {
  $("scenarios").innerHTML = SCEN.map((s) => `
    <div class="card" data-id="${s.id}">
      <div class="tagline">${esc(s.tag)}</div>
      <h3>${esc(s.title)}</h3>
      <p>${esc(s.desc)}</p>
    </div>`).join("");
  document.querySelectorAll(".card").forEach((el) => {
    el.addEventListener("click", () => select(el.dataset.id));
  });
}

function select(id) {
  const s = SCEN.find((x) => x.id === id);
  document.querySelectorAll(".card").forEach((el) => el.classList.toggle("on", el.dataset.id === id));
  renderChain(s);
  renderOutput(s);
}

function renderChain(s) {
  const items = s.steps.map((st) => {
    const res = DATA[st.resp];
    const ok = res.status === "ok" || res.status === "partial";
    const cls = ok ? "ok" : "bad";
    return `<li>
      <span class="tool">${esc(st.tool)}</span>
      <span class="args">${esc(JSON.stringify(st.args))}</span>
      <span class="st ${cls}">${esc(res.status)}</span>
      <details><summary>查看这次返回的原始 JSON（${JSON.stringify(res).length.toLocaleString()} 字符）</summary>
        <pre>${esc(JSON.stringify(res, null, 2))}</pre>
      </details>
    </li>`;
  }).join("");
  $("chain").innerHTML = `<ol class="chain">${items}</ol>`;
}

function renderOutput(s) {
  const fn = { assess: outAssess, label: outLabel, plan: outPlan, error: outError }[s.render];
  $("output").innerHTML = `<div class="out">${fn(s)}</div>`;
}

function outError(s) {
  const res = DATA[s.steps[0].resp];
  const e = res.error || {};
  return `<h3>结论</h3>
    <p class="lead">这次请求没有成功，服务返回了业务错误，没有抛协议异常。</p>
    <div class="kv">
      <div><b>错误码</b><code>${esc(e.code)}</code></div>
      <div><b>可否重试</b>${e.retryable ? "可以" : "不可以"}</div>
      <div><b>状态</b>${esc(res.status)}</div>
    </div>
    <p>${esc(e.message || "")}</p>
    <h3>智能体应该怎么答</h3>
    <p>${errorTalk(e.code)}</p>`;
}

  const d = DATA[s.steps[0].resp].data;
  const recs = d.records || [];
  const cols = [
    ["torso_tilt_left_range", "左侧倾角活动范围", "°"],
    ["torso_tilt_right_range", "右侧倾角活动范围", "°"],
    ["torso_tilt_left_excursion_up", "左侧上向偏移", "°"],
    ["torso_tilt_right_excursion_up", "右侧上向偏移", "°"],
    ["repetition_count_left", "左侧重复次数", " 次"],
    ["repetition_count_right", "右侧重复次数", " 次"],
  ];
  const head = `<tr><th>指标</th>${recs.map((r, i) => `<th>记录 ${i + 1}</th>`).join("")}</tr>`;
  const rows = cols.map(([k, label, u]) => {
    const tds = recs.map((r) => {
      if (!(k in r) || r[k] == null) return `<td class="num">未返回</td>`;
      const v = k.startsWith("repetition") ? r[k].toFixed(0) : r[k].toFixed(3);
      return `<td class="num">${v}${u}</td>`;
    }).join("");
    return `<tr><td>${label}</td>${tds}</tr>`;
  }).join("");
  const ids = recs.map((r, i) =>
    `<li>记录 ${i + 1}：<code>${esc(r.sample_id)}</code>　${r.n_frames} 帧，质量位 ${esc((r.quality || {}).status)}</li>`
  ).join("");
  const reviews = (d.review_items || []).map((x) => `<li>${esc(x)}</li>`).join("");
  const np = (d.not_provided || []).map((x) => `<li>${esc(x)}</li>`).join("");
  const r0 = recs[0] || {};
  return `<h3>一、可比性</h3>
    <p class="lead">先别急着比数字：这 ${recs.length} 条记录是不是同一个人、同一天、同一机位，工具没有确认。不同人之间只能做横向对照，不能读成「进步」。</p>
    <ul>${ids}</ul>
    <h3>二、横截面</h3>
    <table><thead>${head}</thead><tbody>${rows}</tbody></table>
    <h3>三、读法</h3>
    <p>${fmt(r0.torso_tilt_left_range, 3)}° 是左侧倾角在整段动作里的最大值减最小值，反映摆动的幅度，不是姿态好坏。</p>
    <p>重复次数 ${fmt(r0.repetition_count_left, 0)} 次，动作要求是 5 次。多于 5 次可能是多计，少于 5 次可能是录制提前结束——两种都不等于「做得不对」。</p>
    <h3>四、这个工具没给的东西</h3>
    <ul>${np}</ul>
    <h3>五、看之前提醒自己的事</h3>
    <ul>${reviews}</ul>`;
}

function outAssess(s) {
  const res = DATA[s.steps[1].resp];
  const d = res.data;
  const q = (DATA[s.steps[2].resp] || {}).data || {};
  const ev = ((DATA[s.steps[3].resp] || {}).data || {}).evidence || [];
  const evById = {};
  ev.forEach((e) => (evById[e.feature_id] = e));

  const q0 = d.quality || {};
  const devs = (d.deviations || []).slice().sort((a, b) => Math.abs(b.difference) - Math.abs(a.difference));
  const top = devs[0];

  // 结论：只陈述最大偏离，不评价好坏
  let lead = "";
  if (top) {
    const e = evById[top.feature_id] || {};
    const ref = e.reference || {};
    let outside = "";
    if (typeof ref.p25 === "number" && typeof ref.p75 === "number") {
      if (top.observed < ref.p25) outside = `，低于参照四分位区间下沿（${fmt(ref.p25, 2)}°）`;
      else if (top.observed > ref.p75) outside = `，高于参照四分位区间上沿（${fmt(ref.p75, 2)}°）`;
      else outside = `，仍在参照四分位区间（${fmt(ref.p25, 2)}–${fmt(ref.p75, 2)}°）之内`;
    }
    const name = featureName(top.feature_id, d);
    const dir = top.difference < 0 ? "低" : "高";
    lead = `这条记录可用。${name}比参照中位数${dir} ${fmt(Math.abs(top.difference), 2)}°${outside}。`;
  } else {
    lead = "这条记录可用，没有发现与参照有明显差异的指标。";
  }

  // 偏离点表
  const devRows = devs.map((x) => {
    const e = evById[x.feature_id] || {};
    const ref = e.reference || {};
    const iq = (typeof ref.p25 === "number" && typeof ref.p75 === "number")
      ? `${fmt(ref.p25, 2)} – ${fmt(ref.p75, 2)}` : "未返回";
    return `<tr>
      <td>${esc(featureName(x.feature_id, d))}</td>
      <td class="num">${fmt(x.observed, 3)}</td>
      <td class="num">${fmt(x.reference_value, 3)}</td>
      <td class="num">${x.difference > 0 ? "+" : ""}${fmt(x.difference, 3)}</td>
      <td class="num">${iq}</td>
    </tr>`;
  }).join("");

  // 其他特征
  const devIds = new Set(devs.map((x) => x.feature_id));
  const others = (d.features || []).filter((f) => !devIds.has(f.feature_id));
  const otherRows = others.map((f) => `<tr>
      <td>${esc(f.display_name || f.feature_id)}</td>
      <td class="num">${fmt(f.value, 3)}</td>
      <td>${esc(f.unit === "degree" ? "°" : f.unit === "count" ? "次" : f.unit)}</td>
      <td>${f.source_frame_index == null ? "—" : f.source_frame_index}</td>
    </tr>`).join("");

  const L = d.observed_label || {};
  const npc = ((q.unavailable) || []).length;

  return `<h3>结论</h3>
    <p class="lead">${esc(lead)}</p>

    <h3>数据可用性</h3>
    <div class="kv">
      <div><b>总帧数</b>${q0.n_frames}</div>
      <div><b>有效帧</b>${q0.valid_frames}</div>
      <div><b>有效率</b>${(q0.valid_frame_ratio * 100).toFixed(2)}%</div>
      <div><b>质量位</b>${esc(q0.status)}</div>
      <div><b>采样率</b>${fmt((d.diagnostics || {}).frame_rate_hz, 3)} Hz</div>
      <div><b>丢帧率</b>${((d.diagnostics || {}).dropped_interval_ratio * 100).toFixed(2)}%</div>
    </div>

    <h3>判定口径</h3>
    <p>动作：${esc(q.display_name || "Es2")}。要求连续做 ${q.expected_repetitions} 次。</p>
    <p class="note">出处：${esc(q.paper_locator || "")}</p>

    <h3>偏离点（相对 71 名其他受试者）</h3>
    <table><thead><tr>
      <th>特征</th><th>本次</th><th>参照中位数</th><th>差异</th><th>参照四分位区间</th>
    </tr></thead><tbody>${devRows}</tbody></table>
    <p class="note">只有这三项有参照值。表中没出现过的特征，不能拿来说「偏高/偏低」。</p>

    <h3>其他指标（有数值、无参照）</h3>
    <p>另有 ${others.length} 项特征只报数值，不参与偏离判定：</p>
    <details><summary>展开看这 ${others.length} 项</summary>
      <table><thead><tr><th>特征</th><th>值</th><th>单位</th><th>帧号</th></tr></thead>
      <tbody>${otherRows}</tbody></table>
    </details>

    <h3>历史评分（仅供参考，不是我算的）</h3>
    <p>cTS ${fmt(L.cTS, 1)} / cPO ${fmt(L.cPO, 3)} / cCF ${fmt(L.cCF, 3)}——这是当年治疗师给的评分，粒度为「受试者 × 动作」，不代表这次录制或某一次重复。</p>

    <h3>边界</h3>
    <p>参照是这份数据集内 71 名受试者的相对分布，不是临床常模；倾角的绝对值依赖未标定的相机竖直轴，只宜相对比较；本页不做诊断、不评价疗效、不给训练方案。</p>
    <p class="note">服务端还有 ${npc} 项指标被明确标注为「不可得」（腰椎角度、髋角 psi 等），不会用近似值顶替。</p>`;
}

function featureName(id, d) {
  const f = (d.features || []).find((x) => x.feature_id === id);
  return f && f.display_name ? f.display_name : id;
}

function renderQA() {
  $("qa").innerHTML = QA.map((x, i) => `<details${i === 0 ? " open" : ""}>
      <summary>${esc(x.q)}</summary>
      <div class="ans">${x.a.map((p) => `<p>${esc(p)}</p>`).join("")}</div>
    </details>`).join("");
}

function renderFoot() {
  $("foot").innerHTML = `
    <p>数据：KIMORE 公开数据集（Capecci et al. 2019, IEEE TNSRE），78 名受试者 / 398 段动作。</p>
    <p>本页数值全部来自 MCP 工具的真实返回（<code>assess_exercise</code> / <code>query_criteria</code> /
    <code>explain_deviation</code> / <code>plan_session</code> / <code>list_samples</code>），未做修改。</p>
    <p>回放演示 · 生成于 2026-11-26 · 完整智能体需在 Nexent 平台运行</p>`;
}

renderScenarios();
renderQA();
renderFoot();
const _init = new URLSearchParams(location.search).get("s");
select(SCEN.some((x) => x.id === _init) ? _init : "expert");
</script>
